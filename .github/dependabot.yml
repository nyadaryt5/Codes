version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: pyyaml
      - dependency-name: PyYAML
      - dependency-name: pytest
      - dependency-name: pytest-cov
      - dependency-name: ruff
      - dependency-name: mypy
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
