[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veridian"
version = "0.2.0"
description = "Causal worldline lattice: decaying belief, provenance, synthetic-depth guards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Veridian" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
veridian = "veridian.cli:main"
titanfuse = "titanfuse.cli:main"

[tool.setuptools.packages.find]
include = ["veridian*", "titanfuse*"]

[tool.setuptools.package-data]
veridian = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
