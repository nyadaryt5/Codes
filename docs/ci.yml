name: ci
on:
  push:
  pull_request:
jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.lock
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy veridian titanfuse
      - name: Pytest with coverage floor
        run: pytest -q --cov=veridian --cov=titanfuse --cov-report=term-missing --cov-fail-under=60
